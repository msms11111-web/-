# نشر «قطرة» على Netlify.
# $URL يوفره Netlify وقت البناء، فيضبط العنوان الحقيقي في canonical و Open Graph
# و sitemap تلقائيًا — سواء كان نطاقًا مخصصًا أو نطاق netlify.app الافتراضي.

[build]
  publish = "."
  command = "python3 tools/set-site-url.py $URL && python3 tools/check-links.py"

# معاينات الفروع وطلبات السحب تستخدم عنوانها الخاص لا عنوان الإنتاج
[context.deploy-preview.build]
  command = "python3 tools/set-site-url.py $DEPLOY_PRIME_URL && python3 tools/check-links.py"

[context.branch-deploy.build]
  command = "python3 tools/set-site-url.py $DEPLOY_PRIME_URL && python3 tools/check-links.py"
