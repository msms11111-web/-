name: فحص الموقع

# النشر يتولاه Cloudflare Pages عند كل دفعة.
# دور GitHub هنا هو التحقق فقط: ألا يصل رابط مكسور إلى الفرع الرئيسي.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من الروابط الداخلية
        run: python3 tools/check-links.py

      - name: الفحص البنيوي
        run: python3 tools/check-structure.py

      # المصادر الخارجية تُفحص هنا لأن بيئة التطوير قد لا تصل إلى الإنترنت.
      #
      # كان هذا الفحص يمرّ بـcontinue-on-error، فظلّ يرفع رايته سبعًا وعشرين
      # مرة ولا أحد يقرؤها: رابطان ميتان بقيا في الموقع، أحدهما مصدرُ صفحتين
      # كاملتين. فأُزيل الاستثناء.
      #
      # والسكربت نفسه يميّز الحالات: يُخفق على 404 و410 وحدهما، ويتسامح مع
      # 403 و429 (حجب روبوتات لا موت)، ولا يحكم بالموت عند تعذّر الشبكة.
      # فالإخفاق هنا يعني خطأً تحريريًّا حقيقيًّا، لا عطلًا عابرًا.
      - name: التحقق من المصادر الخارجية
        run: python3 tools/check-external-links.py
